name: Build Windows License Generator

# Builds the separate Top In Tech License Generator that lives in
# TopInTech-LicenseGenerator/. It is a completely independent application, so
# this workflow never runs for Pharmacy changes and the Pharmacy workflow never
# runs for generator changes. The two products keep separate installers, and the
# Pharmacy application, its package.json and its installer config stay untouched.

on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths:
      - 'TopInTech-LicenseGenerator/**'
      # Documentation edits do not need a new installer.
      - '!TopInTech-LicenseGenerator/**.md'
      - '!TopInTech-LicenseGenerator/docs/**'
      - '.github/workflows/license-generator.yml'

permissions:
  contents: write

concurrency:
  group: license-generator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: TopInTech-LicenseGenerator
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: TopInTech-LicenseGenerator/package-lock.json

      - name: Install the generator's own dependencies
        run: npm ci

      - name: Test signing, keys, database, wiring and renderer
        run: npm test

      - name: Electron window, serial, database and desktop-icon smoke test
        shell: bash
        run: npx electron tests/electron-smoke.js 2>&1 | tee smoke.log

      - name: Build the Windows setup and portable EXE
        shell: bash
        run: |
          set -o pipefail
          npm run dist:win 2>&1 | tee build.log
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: List the built files
        shell: bash
        run: ls -l release/*.exe

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: top-in-tech-license-generator
          path: |
            TopInTech-LicenseGenerator/release/*.exe
            TopInTech-LicenseGenerator/build.log
            TopInTech-LicenseGenerator/smoke.log
            TopInTech-LicenseGenerator/artifacts/**
          if-no-files-found: warn
          retention-days: 30

      - name: Publish the downloadable installer
        if: success()
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./TopInTech-LicenseGenerator/package.json').version")
          setup=$(node -p "require('./TopInTech-LicenseGenerator/package.json').build.nsis.artifactName")
          portable=$(node -p "require('./TopInTech-LicenseGenerator/package.json').build.portable.artifactName")
          tag="generator-v${version}"
          echo "expected setup    : $setup"
          echo "expected portable : $portable"
          echo "::notice title=Expected downloads::$setup and $portable"
          ls -l TopInTech-LicenseGenerator/release/
          notes="Owner-only offline serial key generator for Top In Tech desktop applications (Electron + SQLite + HTML/CSS/Vanilla JavaScript). **Top In Tech License Generator.exe** installs with one double-click, creates a desktop icon and opens the app. **Top In Tech License Generator Portable.exe** runs without installing. The private signing key is created on the owner's computer on first run and never ships with the app. Unsigned build: verify the source commit and checksums."
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "Top In Tech License Generator ${version} for Windows" --notes "$notes" --prerelease
          fi
          gh release edit "$tag" --notes "$notes"
          # Remove installers from earlier builds first, so the page only ever
          # offers the current downloads.
          gh release view "$tag" --json assets -q '.assets[].name' > current-assets.txt || true
          while IFS= read -r asset; do
            [ -z "$asset" ] && continue
            if [ "$asset" = "$setup" ] || [ "$asset" = "$portable" ]; then continue; fi
            case "$asset" in *.exe|*.blockmap|*.yml) ;; *) continue ;; esac
            echo "removing stale asset: $asset"
            gh release delete-asset "$tag" "$asset" -y || true
          done < current-assets.txt
          rm -f current-assets.txt
          shopt -s nullglob
          built=(TopInTech-LicenseGenerator/release/*.exe)
          if [ ${#built[@]} -eq 0 ]; then
            echo "::error title=Nothing to publish::electron-builder produced no .exe in release/"
            exit 1
          fi
          for file in "${built[@]}"; do echo "uploading: $(basename "$file")"; done
          gh release upload "$tag" "${built[@]}" --clobber
          count=$(gh release view "$tag" --json assets -q '.assets | length')
          echo "assets after upload: $count"
          gh release view "$tag" --json assets -q '.assets[] | "\(.name) | \(.size) bytes"' > assets.txt || true
          cat assets.txt || true
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::notice title=Release asset::$line"
          done < assets.txt
          rm -f assets.txt
          if [ "$count" -lt 2 ]; then
            echo "::error title=Missing installers::the release does not have both installers"
            exit 1
          fi

      - name: Show build failures in the run summary
        if: failure()
        shell: bash
        run: |
          if [ -f smoke.log ]; then
            {
              echo '### Electron smoke output'
              echo '```'
              tail -c 4000 smoke.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f artifacts/smoke-error.txt ]; then
            {
              echo '### Smoke failure'
              echo '```'
              tail -c 4000 artifacts/smoke-error.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f build.log ]; then
            tail -c 6000 build.log > failure-tail.txt
            {
              echo '### Generator build failed'
              echo '```'
              cat failure-tail.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            message=$(tail -c 20000 build.log)
            echo "::error title=Generator build failure::${message//$'\n'/%0A}"
          fi

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: top-in-tech-license-generator-build-log
          path: |
            TopInTech-LicenseGenerator/build.log
            TopInTech-LicenseGenerator/failure-tail.txt
          if-no-files-found: ignore
          retention-days: 14
