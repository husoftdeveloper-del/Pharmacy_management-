name: Place verified Windows installer
on:
  push:
    paths:
      - '.github/workflows/place-installer.yml'
permissions:
  contents: write
concurrency:
  group: place-installer-${{ github.ref }}
  cancel-in-progress: false
jobs:
  place:
    if: github.ref == 'refs/heads/arena/0746dde2-pharmacy-management'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/0746dde2-pharmacy-management
          fetch-depth: 0
      - name: Download and verify the published installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p src/pages
          gh release download v1.0.0-build.12 --pattern 'Pharmacy-1.0.0-x64.exe' --dir "$RUNNER_TEMP"
          echo '1dfa7f6fd5dbdaef5f8f12ed4923b8e7679726ac0a05e5bf5bc271fc19f2432d  '"$RUNNER_TEMP"'/Pharmacy-1.0.0-x64.exe' | sha256sum --check
          cp "$RUNNER_TEMP/Pharmacy-1.0.0-x64.exe" src/pages/Pharmacy-Setup.exe
      - name: Add installer to the active branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/Pharmacy-Setup.exe
          if git diff --cached --quiet; then
            echo 'Installer is already present.'
            exit 0
          fi
          git commit -m 'Add verified Windows installer to pages folder'
          git push origin HEAD:refs/heads/arena/0746dde2-pharmacy-management
